<!doctype html><meta charset="utf-8"><title>Emberwick as a journey: storyboard</title>
<style>
@font-face { font-family: 'Cormorant Garamond'; font-weight: 500; font-style: italic; src: url('../../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2') format('woff2'); }
body{margin:0;background:#07060f;display:flex;flex-wrap:wrap;gap:12px;padding:12px}canvas{display:block}
</style>
<script type="module">
import { route, place, beat } from './pass6-stills.js';
window.errors = [];
window.addEventListener('error', (e) => window.errors.push(String(e.message)));
const add = (name, w, h, draw) => { const cv = document.createElement('canvas'); cv.width = w * 2; cv.height = h * 2; cv.style.width = w + 'px'; cv.dataset.name = name; const c = cv.getContext('2d'); c.scale(2, 2); try { draw(c, w, h); } catch (e) { window.errors.push(name + ': ' + e.stack); } document.body.append(cv); };
await document.fonts.load('italic 500 20px "Cormorant Garamond"');
add('route', 1560, 860, route);
for (const n of [1, 2, 3, 4, 5, 6]) add(`place-${n}`, 390, 844, (c, w, h) => place(c, w, h, n));
for (const kind of ['pad', 'orb', 'wall']) for (const k of [0, 1, 2]) add(`${kind}-${k}`, 360, 360, (c, w, h) => beat(c, w, h, kind, k));
document.title = 'ready';
</script>
