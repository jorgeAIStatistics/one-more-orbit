<script src="kit.js"></script><script src="a-dusk.js"></script><script src="canon-afterglow.js"></script><script src="canon-sheets.js"></script>
<script>
window.errors = []; window.done = false;
const only = new URLSearchParams(location.search).get('only');
(async () => {
  await Promise.all([document.fonts.load('italic 500 20px "Cormorant Garamond"'), document.fonts.load('normal 500 20px "Cormorant Garamond"'), document.fonts.load('normal 500 20px "Cormorant Lining"')]);
  for (const [name, S] of Object.entries(SHEETS)) {
    if (only && !name.startsWith(only)) continue;
    const cv = document.createElement('canvas'); cv.width = S.w; cv.height = S.h; cv.id = `${name}-sheet`; cv.style.cssText = 'display:block;margin:8px auto;max-width:100%';
    try { S.draw(cv.getContext('2d'), S.w, S.h); } catch (e) { window.errors.push(`${name}: ${e.stack || e}`); }
    document.body.appendChild(cv);
  }
  window.done = true;
})();
</script>
